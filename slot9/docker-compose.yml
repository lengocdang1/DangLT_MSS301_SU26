version: '3.8'

services:
  # MySQL for order-service & inventory-service
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
      - "3308:3306" # Route 3308 to 3306 as well for services configured with 3308
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql
    restart: always

  # MongoDB for product-service
  mongodb:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
    restart: always

  # SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourPassword123!"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always

volumes:
  mysql_data:
  mongo_data:
  mssql_data:
