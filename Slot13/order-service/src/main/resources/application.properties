server.port=8081
spring.application.name=order-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:order_user}
spring.datasource.password=${DB_PASSWORD:order_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

services.inventory.url=${INVENTORY_URL:http://localhost:8082}
services.payment.url=${PAYMENT_URL:http://localhost:8083}

spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

saga.demo.payment-delay-ms=${PAYMENT_DELAY_MS:0}
