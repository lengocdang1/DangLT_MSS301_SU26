spring.application.name=inventory-service
server.port=8082

# ─────────────────────────────────────────────────────────────
# MongoDB – kết nối tới replica set rs0 (bắt buộc cho @Transactional)
# ─────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/inventorydb?replicaSet=rs0
spring.data.mongodb.auto-index-creation=true

# ─────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────
logging.level.com.fudn.inventoryservice=DEBUG
logging.level.org.springframework.data.mongodb=INFO
