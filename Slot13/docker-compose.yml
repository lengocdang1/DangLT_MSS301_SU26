services:
  # MySQL - orderdb
  mysql:
    image: mysql:8.0
    container_name: orderdb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SQL Server - paymentdb
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paymentdb
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Payment@123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Payment@123' -C -Q \"IF DB_ID('paymentdb') IS NULL CREATE DATABASE paymentdb\" -No || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # MongoDB replica set rs0 - inventorydb (required for @Transactional)
  mongo:
    image: mongo:7.0
    container_name: inventorydb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # inventory-service (cổng 8082, MongoDB)
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    ports:
      - "8082:8082"
    environment:
      MONGO_URI: mongodb://mongo:27017/inventorydb?directConnection=true
    depends_on:
      mongo:
        condition: service_healthy

  # payment-service (cổng 8083, SQL Server)
  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=paymentdb;encrypt=false;trustServerCertificate=true
      DB_USER: sa
      DB_PASSWORD: Payment@123
    depends_on:
      sqlserver:
        condition: service_healthy

  # order-service (cổng 8081, MySQL) - Saga Orchestrator
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/orderdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: order_user
      DB_PASSWORD: order_pass
      INVENTORY_URL: http://inventory-service:8082
      PAYMENT_URL: http://payment-service:8083
      PAYMENT_DELAY_MS: ${PAYMENT_DELAY_MS:-0}
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

volumes:
  mysql_data:
  sqlserver_data:
  mongo_data:
