version: "3.8"

services:
  # MySQL - orderdb
  mysql:
    image: mysql:8.0
    container_name: orderdb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order_user
      MYSQL_PASSWORD: order_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # SQL Server - paymentdb
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paymentdb
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Payment@123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Payment@123", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # MongoDB replica set rs0 - inventorydb (required for @Transactional)
  mongo:
    image: mongo:7.0
    container_name: inventorydb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  sqlserver_data:
  mongo_data:
